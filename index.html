<style>/* ============================================================
   감사해U v3 · 공통 스타일 (시즌2 디자인 전부 유지 + 시즌3 추가)
   ============================================================ */
:root{
  --bg-base:#F9FAFB; --bg-tint:#FAF6F0;
  --ink-900:#0F172A; --ink-700:#334155; --ink-500:#64748B;
  --ink-400:#94A3B8; --ink-300:#CBD5E1; --ink-200:#E2E8F0;
  --line:rgba(15,23,42,0.06); --line-soft:rgba(15,23,42,0.04);
  --em-50:#FAF3E8; --em-100:#F4E6D3; --em-200:#EBD5B7;
  --em-300:#E7C6A8; --em-400:#D89A73; --em-500:#B1603E;
  --em-600:#96552F; --em-700:#5C4033; --em-800:#4E382B; --em-900:#3B2A20;
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-out:cubic-bezier(0.22,0.61,0.36,1);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
html,body,#root{height:100%;}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:-0.02em; word-break:keep-all; overflow-wrap:break-word;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(177,96,62,0.06), transparent 60%),
    radial-gradient(1000px 500px at 110% 110%, rgba(178,90,17,0.05), transparent 55%),
    var(--bg-base);
  min-height:100vh; overflow-x:hidden; margin:0;
  -webkit-font-smoothing:antialiased; color:var(--ink-900);
}
.logo-font{font-family:'Jua',sans-serif;letter-spacing:-0.01em;}
.fw700{font-weight:700;letter-spacing:-0.025em;}
.fw800{font-weight:800;letter-spacing:-0.035em;}
.fw900{font-weight:900;letter-spacing:-0.04em;}
.track-tight{letter-spacing:-0.025em;}
.track-tighter{letter-spacing:-0.035em;}

.card{background:rgba(255,255,255,0.74);border:1px solid var(--line-soft);border-radius:24px;
  box-shadow:0 1px 2px rgba(15,23,42,0.025),0 4px 14px rgba(15,23,42,0.035),0 20px 48px rgba(15,23,42,0.04);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);}
.card-hero{background:linear-gradient(180deg,rgba(255,255,255,0.80),rgba(252,248,241,0.68));
  border:1px solid rgba(177,96,62,0.08);border-radius:28px;
  box-shadow:0 1px 2px rgba(15,23,42,0.025),0 4px 18px rgba(15,23,42,0.04),0 24px 60px rgba(78,56,43,0.06);
  backdrop-filter:blur(18px) saturate(155%);-webkit-backdrop-filter:blur(18px) saturate(155%);}

@keyframes a-fall{

  26% {transform:translate3d(var(--sway,24px),22vh,0) rotate(calc(var(--tilt,0deg) + 72deg))}
  50% {opacity:var(--maxop,.85); transform:translate3d(calc(var(--sway,24px) * -0.55),47vh,0) rotate(calc(var(--tilt,0deg) + 148deg))}
  74% {transform:translate3d(var(--sway,24px),72vh,0) rotate(calc(var(--tilt,0deg) + 224deg))}
  93% {opacity:calc(var(--maxop,.85) * .8)}

  // 진단용: 요청별 [총 왕복 ms / 서버 내부 처리 ms] 를 기록 — 콘솔에서 GU.perf 로 확인
  //   총 왕복 ≫ 서버 처리 이면 Google Apps Script 기동/네트워크 비용(코드로 못 줄임),
  //   서버 처리가 크면 우리 코드 문제.
  GU.perf = [];
  GU.pending = 0;   // 진행 중인 서버 요청 수 — app.html 스플래시 안전장치가 참고
  async function post(body){
    var t0 = performance.now();
    GU.pending++;
    var r;
    try{ r = await fetch(GU.SHEET_URL, {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }); }catch(e){ GU.pending--; throw e; }
    var j;
    try{ j = await r.json(); }finally{ GU.pending--; }
    try{
      var rec = { action: body.action, total: Math.round(performance.now() - t0), server: (j && j._t) || null, at: new Date().toLocaleTimeString() };
      GU.perf.push(rec);
      if(GU.perf.length > 50) GU.perf.shift();
      if(GU._debug) GU._debug(rec);
    }catch(e){}
    return j;
  }
  // 주소 뒤에 ?debug=1 을 붙이면 화면 왼쪽 아래에 최근 요청 시간이 표시됨 (원인 파악용 · 평소엔 안 보임)
  if(/[?&]debug=1/.test(location.search)){
    var box = null;
    GU._debug = function(rec){
      if(!box){
        box = document.createElement("div");
        box.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9999;background:rgba(15,23,42,.88);color:#E2E8F0;font:11px/1.5 monospace;padding:8px 10px;border-radius:10px;max-width:280px;pointer-events:none;white-space:pre;";
        document.body.appendChild(box);
      }
      var lines = GU.perf.slice(-6).map(function(p){ return p.at.slice(0,8) + " " + (p.action+"            ").slice(0,14) + " " + p.total + "ms" + (p.server != null ? " (서버 " + p.server + ")" : ""); });
      box.textContent = "요청 시간 (총 / 서버처리)\n" + lines.join("\n");
    };
  }

  GU.api = async function(action, payload){
    var body = Object.assign({ action: action }, payload || {});
    if(!GU.SHEET_URL || GU.SHEET_URL.indexOf("PASTE_") === 0){
      return { ok:false, error:"config.js의 SHEET_URL에 새 백엔드 /exec 주소를 넣어주세요." };
    }
    try{
      return await post(body);
    }catch(e){
      if(!RETRY_SAFE[action]){
        console.warn("API 실패:", action, e && e.message);
        return { ok:false, error:"연결이 불안정해요. 잠시 후 다시 시도해주세요." };
      }
      try{ return await post(body); }
      catch(e2){
        console.warn("API 실패:", action, e2 && e2.message);
        return { ok:false, error:"연결이 불안정해요. 잠시 후 다시 시도해주세요." };
      }
    }
  };

  // 인증 동봉 호출 — 세션(uid/pw)을 자동으로 붙임
  GU.authApi = function(action, payload){
    var s = GU.session || {};
    return GU.api(action, Object.assign({ uid: s.uid, password: s.pw }, payload || {}));
  };

  // 응답을 기다리지 않는 발사 후 망각 (이메일 알림용)
  GU.fireForget = function(action, payload){
    var s = GU.session || {};
    try{
      fetch(GU.SHEET_URL, {
        method:"POST", mode:"cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action:action, uid:s.uid, password:s.pw }, payload||{})),
        keepalive: true
      }).catch(function(){});
    }catch(e){}
  };

  /* ---------- 저장소 유틸 ---------- */
  function lsGet(key){
    try{ return JSON.parse(__demoLS.getItem(key) || "null"); }catch(e){ return null; }
  }
  function lsSet(key, val){
    try{ __demoLS.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
  function lsDel(key){ try{ __demoLS.removeItem(key); }catch(e){} }

  /* ---------- 자동 로그인 (기본 ON · 로그아웃으로 해제) ----------
   * ⚠ 기기에 PIN이 저장됩니다(난독화는 보안이 아님). 공용 PC는 로그아웃 필수 — UI에 안내.
   */
  function enc(o){ try{ return btoa(encodeURIComponent(JSON.stringify(o))); }catch(e){ return ""; } }
  function dec(s){ try{ return JSON.parse(decodeURIComponent(atob(s))); }catch(e){ return null; } }

  GU.saveAuth = function(session){
    lsSet("gu3.fac", session.fac);
    try{ __demoLS.setItem("gu3.auth", enc({ uid:session.uid, pw:session.pw, fac:session.fac })); }catch(e){}
  };
  GU.loadAuth = function(){
    var raw = null;
    try{ raw = __demoLS.getItem("gu3.auth"); }catch(e){}
    return raw ? dec(raw) : null;
  };
  GU.clearAuth = function(){ lsDel("gu3.auth"); };
  GU.savedFac = function(){ return lsGet("gu3.fac"); };
  GU.saveFac = function(fac){ lsSet("gu3.fac", fac); };

  /* ---------- 명단 캐시 (rosterVersion 기반) ---------- */
  GU.rosterCache = {
    loadPublic: function(fac){ return lsGet("gu3.roster.pub." + fac); },
    savePublic: function(fac, data){ lsSet("gu3.roster.pub." + fac, data); },
    loadFull: function(){ return lsGet("gu3.roster.full"); },
    saveFull: function(data){ lsSet("gu3.roster.full", data); lsSet("gu3.roster.ver", (data && data.ver) || 0); }   // ⚡ 부팅용 버전 마커 동시 기록
  };
  // 전체 명단 확보(버전 일치 시 캐시 사용) → uid→직원 맵과 배열 반환
  GU.ensureRosterFull = async function(serverVer){
    var cached = GU.rosterCache.loadFull();
    if(cached && cached.ver === serverVer && Array.isArray(cached.staff)) return cached;
    var r = await GU.authApi("getRosterFull");
    if(r && r.ok){
      var data = { ver: r.ver, staff: r.staff };
      GU.rosterCache.saveFull(data);
      return data;
    }
    return cached || { ver: 0, staff: [] };
  };

  /* ---------- 개인 데이터 캐시 (쪽지함·일기) ----------
   * 스키마 불일치·파싱 실패 시 통째로 버리고 전체 재동기화.
   * 받은/보낸 각각 최근 LIST_CACHE_MAX건만 보관(용량 보호).
   */
  function dataKey(uid){ return "gu3.data." + uid; }

  var _dcMemo = { uid: null, data: null };   // ⚡ 같은 로그인 흐름의 중복 파싱 제거
  GU.dataCache = {
    load: function(uid){
      if(_dcMemo.uid === uid && _dcMemo.data) return _dcMemo.data;
      var o = lsGet(dataKey(uid));
      if(!o || o.schema !== GU.CACHE_SCHEMA ||
         !Array.isArray(o.inbox) || !Array.isArray(o.sent) || !Array.isArray(o.diary)){
        lsDel("gu3.hasData." + uid);          // 마커 자가치유 — 손상 시 다음 부팅은 전체 동기화
        return null;
      }
      lsSet("gu3.hasData." + uid, GU.CACHE_SCHEMA);   // 기존 사용자 1회 자동 이행
      _dcMemo = { uid: uid, data: o };
      return o;
    },
    fresh: function(){
      return { schema: GU.CACHE_SCHEMA, latestTs: 0, lastReadTs: 0, inbox: [], sent: [], diary: [] };
    },
    save: function(uid, data){
      data.inbox = data.inbox.slice(0, GU.LIST_CACHE_MAX);
      data.sent  = data.sent.slice(0, GU.LIST_CACHE_MAX);
      data.diary = data.diary.slice(0, 400);   // 일기도 상한(용량 보호)
      var ok = lsSet(dataKey(uid), data);
      if(!ok){
        // 용량 초과 → 보관량 절반으로 줄여 재시도
        data.inbox = data.inbox.slice(0, Math.floor(GU.LIST_CACHE_MAX/2));
        data.sent  = data.sent.slice(0, Math.floor(GU.LIST_CACHE_MAX/2));
        data.diary = data.diary.slice(0, 200);
        ok = lsSet(dataKey(uid), data);
      }
      if(ok) lsSet("gu3.hasData." + uid, GU.CACHE_SCHEMA); else lsDel("gu3.hasData." + uid);
      _dcMemo = { uid: uid, data: data };
    },
    clear: function(uid){ lsDel(dataKey(uid)); lsDel("gu3.hasData." + uid); if(_dcMemo.uid === uid) _dcMemo = { uid:null, data:null }; }
  };

  // 신규 쪽지를 캐시에 병합 — (ts|from|to) 복합키로 중복 제거, 최신순 유지
  GU.mergeNotes = function(data, uid, newNotes){
    if(!newNotes || !newNotes.length) return 0;
    var seen = {};
    data.inbox.forEach(function(n){ seen[n.ts + "|" + n.from + "|" + n.to] = 1; });
    data.sent.forEach(function(n){ seen[n.ts + "|" + n.from + "|" + n.to] = 1; });
    var added = 0;
    newNotes.forEach(function(n){
      var k = n.ts + "|" + n.from + "|" + n.to;
      if(seen[k]) return;
      seen[k] = 1;
      if(n.to === uid) data.inbox.unshift(n);
      if(n.from === uid) data.sent.unshift(n);
      added++;
    });
    data.inbox.sort(function(a,b){ return b.ts - a.ts; });
    data.sent.sort(function(a,b){ return b.ts - a.ts; });
    return added;
  };
})();

    } else if (/SamsungBrowser/i.test(ua)){

      note = "보안 창은 구글 스토어 밖에서 설치되는 모든 앱에 뜨는 일반 안내예요. 우리 회사 앱이니 안심하고 진행하세요 🧡";
    } else if (/Android/i.test(ua)){
      title = "갤럭시(Chrome)에 추가하기";

                "‘홈 화면에 추가’ 또는 ‘앱 설치’를 눌러요",

/* ---------- 🔔 푸시 알림 (홈 화면 앱용) ----------
 * 갤럭시·PC: '알림 허용' 한 번이면 끝. 아이폰: 홈 화면에 추가한 뒤에만 가능(애플 정책).
 * 서버에는 기기 주소(endpoint)만 저장 — 알림 내용은 항상 기기가 스스로 표시.
 */
(function(){
  var GU = window.GU;

  function b64uToU8(s){
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while(s.length % 4) s += "=";
    var raw = atob(s), out = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function isStandalone(){
    try{ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || !!navigator.standalone; }catch(e){ return false; }
  }

  // 'need-install' | 'unsupported' | 'denied' | 'on' | 'off'
  GU.pushState = async function(){
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
    if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){
      return (ios && !isStandalone()) ? "need-install" : "unsupported";
    }
    if(Notification.permission === "denied") return "denied";
    try{
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      return sub ? "on" : "off";
    }catch(e){ return "off"; }
  };

  GU.pushEnable = async function(){
    try{
      var perm = await Notification.requestPermission();
      if(perm !== "granted") return { ok:false, denied: perm === "denied" };
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64uToU8(GU.PUSH_PUBLIC_KEY) });
      }
      var j = sub.toJSON ? sub.toJSON() : {};
      var r = await GU.authApi("pushSubscribe", { endpoint: sub.endpoint, keys: j.keys || {} });
      if(!r || !r.ok){ try{ await sub.unsubscribe(); }catch(e){} return { ok:false, error:(r && r.error) || "등록 실패" }; }
      return { ok:true };
    }catch(e){ return { ok:false, error:String((e && e.message) || e) }; }
  };

  GU.pushDisable = async function(){
    try{
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if(sub){
        var ep = sub.endpoint;
        try{ await sub.unsubscribe(); }catch(e){}
        GU.authApi("pushUnsubscribe", { endpoint: ep });
      }
      return { ok:true };
    }catch(e){ return { ok:false }; }
  };

  /* 🔔 로그인 후 원탭 알림 켜기 배너 — 브라우저 규칙상 '자동 켜기'는 불가능하므로,
   * 켤 수 있는 기기에서 한 번만 부드럽게 권유(닫으면 다시 안 뜸). */
  GU.maybeShowPushBanner = async function(){
    try{
      if(__demoLS.getItem("gu3.pushAsked")) return;
      var st = await GU.pushState();
      if(st !== "off") return;                       // 이미 켰거나, 못 켜는 환경이면 조용히
      var bar = document.createElement("div");
      bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:64px;z-index:9998;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#FFFDF9;box-shadow:0 8px 28px rgba(59,42,32,.28);border:1px solid #EDE0CE;animation:gu-bnr .4s ease;";
      bar.innerHTML =
        '<style>@keyframes gu-bnr{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}</style>' +
        '<span style="font-size:20px;">🔔</span>' +
        '<span style="flex:1;font-size:12.5px;line-height:1.5;color:#5C4033;font-weight:700;">쪽지가 오면 바로 알려드릴까요?</span>' +
        '<button id="gu-bnr-on" style="flex-shrink:0;padding:9px 16px;border:none;border-radius:9999px;background:linear-gradient(135deg,#554036,#3C2C24);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;">알림 켜기</button>' +
        '<button id="gu-bnr-x" aria-label="닫기" style="flex-shrink:0;width:28px;height:28px;border:none;border-radius:50%;background:#F3EADD;color:#8A6A4B;font-weight:800;cursor:pointer;">✕</button>';
      function gone(){ try{ __demoLS.setItem("gu3.pushAsked", "1"); }catch(e){} try{ document.body.removeChild(bar); }catch(e){} }

  // 체험 계정(김밀알)이 바로 볼 수 있는 쪽지들

  var DIARY = [

    { ts: NOW - 3 * DAY - 4 * 3600e3, uid:1, text:"동료가 건네준 따뜻한 커피 한 잔에 감사." },

  ].map(function(e){ e.date = kstDay(e.ts); return e; });
  var READS = { 1: NOW - 26 * 3600e3 };

  /* ---------- 유틸 ---------- */
  function byId(uid){ uid = Number(uid); for(var i=0;i<STAFF.length;i++){ if(STAFF[i].id === uid) return STAFF[i]; } return null; }
  function normPw(p){ return String(p || "").replace(/^pw/, ""); }

  function noteOut(n){ return { ts:n.ts, date:n.date, from:n.from, to:n.to, templates:n.templates.slice(), message:n.message }; }
  function inboxOf(uid){ return NOTES.filter(function(n){ return n.to === uid; }).slice().reverse().map(noteOut); }

  function capOf(uid){
    var td = today(), sent = [], recv = [], diary = 0;
    NOTES.forEach(function(n){ if(n.date !== td) return; if(n.from === uid && sent.indexOf(n.to) < 0) sent.push(n.to); if(n.to === uid && recv.indexOf(n.from) < 0) recv.push(n.from); });
    DIARY.forEach(function(e){ if(e.uid === uid && e.date === td) diary = 1; });

  function reachers(){

      .sort(function(a,b){ return b.level - a.level; });

  function todayCounts(fac){

  }

  }
  function milestoneOf(oldT, newT){ if(oldT < 60 && newT >= 60) return 60; if(oldT < 80 && newT >= 80) return 80; if(oldT < 100 && newT >= 100) return 100; return 0; }
  function scopeOf(admin, fac){
    if(admin.role === 1 && fac === "전체") return STAFF.slice();

  }
  function mmdd(ts){ var d = kstDay(ts); return d.slice(5); }

  /* ---------- 액션 처리 ---------- */
  function handle(a, p){

      case "getRoster": return rosterPublic(p.fac);
      case "checkUser": { var cu = byId(p.uid); return cu ? { ok:true, isNew: !cu.pw } : { ok:false, error:"명단에 없는 계정이에요." }; }
      case "setPassword": {

        su.pw = normPw(p.password); VER++;

      }

        if(!me) return { ok:false, error:"로그인이 필요해요." };

        var cF = capOf(me.id), cT = capOf(to);
        var oldF = TEMPS[me.id], oldT = TEMPS[to];
        var fromRise = cF.sent.indexOf(to) < 0 && cF.E < 3 && oldF < 100;
        var toRise   = cT.recv.indexOf(me.id) < 0 && cT.E < 3 && oldT < 100;
        var reason = oldF >= 100 ? "temp_maxed" : cF.sent.indexOf(to) >= 0 ? "duplicate_recipient" : cF.E >= 3 ? "daily_cap_reached" : "rose";
        var ts = Math.max(Date.now(), lastTs() + 1);
        NOTES.push({ ts:ts, date:kstDay(ts), from:me.id, to:to, templates:(p.templates || []).slice(), message:String(p.message || "") });
        var newF = fromRise ? Math.min(100, oldF + 1) : oldF;
        if(fromRise) TEMPS[me.id] = newF;
        if(toRise) TEMPS[to] = Math.min(100, oldT + 1);
        return { ok:true, ts:ts, myTemp:newF, rose:fromRise, reason:reason, milestone: fromRise ? milestoneOf(oldF, newF) : 0 };
      }

        var c = capOf(me.id), old = TEMPS[me.id];
        var maxed = old >= 100, already = !!c.diary, capped = c.E >= 3;
        var rise = !maxed && !already && !capped;
        var ts2 = Date.now(), entry = { ts:ts2, uid:me.id, date:kstDay(ts2), text:text };
        DIARY.push(entry);

      case "setEmailPref": if(me) me.notify = !!p.enabled; return { ok:true };
      case "sendEmailNotification": case "pushSubscribe": case "pushUnsubscribe": return { ok:true };
      case "getNotice": return { ok:true, active:NOTICES["전체"].active, content:NOTICES["전체"].content };
    }
    /* ---- 관리자 ---- */
    if(a.indexOf("admin") === 0){
      if(!me || me.role > 2) return { ok:false, error:"관리자 권한이 필요해요." };
      var scope = scopeOf(me, p.fac), ids = scope.map(function(s){ return s.id; });

            var mk = n.date.slice(0, 7); monthly[mk] = (monthly[mk] || 0) + 1;

const medalEmojiFor = t => t >= 100 ? "🥇" : t >= 80 ? "🥈" : t >= 60 ? "🥉" : "";

function printNotesFallback({
  me,
  list,
  tab,
  temp

  const inner = buildNotesHTML({
    me,
    list,
    tab,
    temp
  });
  const docTitle = `감사해U_${parseS(me).name}_${tab === "inbox" ? "받은" : "보낸"}쪽지`;
  const w = window.open("", "_blank");
  if (!w) return false;
  w.document.write('<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/>' + '<title>' + docTitle + '</title>' + '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>' + '<style>*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}' + 'body{margin:0;padding:14px;background:#fff;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;letter-spacing:-0.02em;word-break:keep-all;}' + '@page{size:A4;margin:10mm;}.pdf-card{break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid;}</style></head><body>' + inner + '<scr' + 'ipt>window.onload=function(){setTimeout(function(){window.print();},350);};</scr' + 'ipt>' + '</body></html>');
  w.document.close();
  return true;
}
